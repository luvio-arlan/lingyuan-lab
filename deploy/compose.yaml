name: lingyuan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lingyuan
      POSTGRES_USER: lingyuan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingyuan -d lingyuan"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lingyuan:${POSTGRES_PASSWORD}@db:5432/lingyuan
      RATE_LIMIT_SALT: ${RATE_LIMIT_SALT:?Set RATE_LIMIT_SALT in deploy/.env}
      TRUSTED_PROXY: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [private]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [private, edge]

  backup:
    image: postgres:16-alpine
    user: "${BACKUP_UID:-0}:${BACKUP_GID:-0}"
    profiles: [maintenance]
    entrypoint: ["/bin/sh", "/app/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: lingyuan
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: lingyuan
      BACKUP_DIR: /backups
    volumes:
      - ../database/scripts/backup.sh:/app/backup.sh:ro
      - ${BACKUP_DIR:?Set BACKUP_DIR in deploy/.env}:/backups
    depends_on:
      db: {condition: service_healthy}
    networks: [private]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: true
  edge:
